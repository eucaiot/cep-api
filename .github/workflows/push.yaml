name: Push Workflow
on: 
    push:
        branches:
            - feature/*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build Go project
        run: go build -v ./...
      - name: Tests Go project
        run: go test ./... -v
